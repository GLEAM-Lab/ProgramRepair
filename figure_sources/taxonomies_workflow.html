<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM-based Software Repair Workflow</title>
  <style>
    :root{
      --paper:#f7f4ec;
      --ink:#18212c;
      --muted:#566474;
      --line:#1f6381;
      --dash:#8bb6c9;
      --soft:#eaf4fb;
      --cream:#fff4c8;
      --green:#3f8558;
      --border:#c8d4df;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:var(--paper);
      font-family:"Helvetica Neue",Arial,"DejaVu Sans",sans-serif;
      color:var(--ink);
      padding:28px;
    }
    main{width:min(98vw,1600px)}
    .toolbar{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-bottom:12px;
    }
    button{
      border:1px solid rgba(24,33,44,.15);
      background:#fff;
      border-radius:8px;
      padding:7px 12px;
      font:700 13px/1 inherit;
      cursor:pointer;
      color:var(--ink);
      box-shadow:0 2px 8px rgba(24,33,44,.08);
    }
    button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
    .frame{
      background:#fff;
      border:1px solid rgba(24,33,44,.12);
      border-radius:14px;
      overflow:hidden;
      box-shadow:0 18px 40px rgba(24,33,44,.12);
    }
    svg{display:block;width:100%;height:auto}
    .title{font-size:28px;font-weight:800;letter-spacing:.2px;fill:var(--ink)}
    .subtitle{font-size:15px;font-weight:500;fill:var(--muted)}
    .lane-title{font-size:22px;font-weight:800;fill:#1b2430}
    .box-text{font-size:18px;font-weight:600;fill:#1b2430}
    .small{font-size:14px;font-weight:600;fill:var(--muted)}
    .tiny{font-size:12px;font-weight:500;fill:var(--muted)}
    .tag{font-size:16px;font-weight:600;fill:#1b2430}
    .evidence{font-size:18px;font-weight:700;fill:#1b2430}
    .rail-title{font-size:20px;font-weight:800;fill:#1b2430}
    .legend-text{font-size:13px;font-weight:500;fill:var(--muted)}
  </style>
</head>

<script>
  function serializedSvg(){
    const svg = document.getElementById('workflow').cloneNode(true);
    svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
    const style = document.createElementNS('http://www.w3.org/2000/svg','style');
    style.textContent = Array.from(document.styleSheets)
      .map(sheet => {
        try { return Array.from(sheet.cssRules).map(rule => rule.cssText).join('\n'); }
        catch(e) { return ''; }
      }).join('\n');
    svg.insertBefore(style, svg.firstChild);
    return new XMLSerializer().serializeToString(svg);
  }
  function downloadBlob(blob, name){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 200);
  }
  function downloadSvg(){
    downloadBlob(new Blob([serializedSvg()], {type:'image/svg+xml;charset=utf-8'}), 'taxonomies_workflow.svg');
  }
  function downloadPng(scale){
    const svgText = serializedSvg();
    const img = new Image();
    const url = URL.createObjectURL(new Blob([svgText], {type:'image/svg+xml;charset=utf-8'}));
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 1600 * scale;
      canvas.height = 990 * scale;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      canvas.toBlob(blob => downloadBlob(blob, scale === 2 ? 'taxonomies_workflow.png' : `taxonomies_workflow_${scale}x.png`), 'image/png');
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }
</script>
