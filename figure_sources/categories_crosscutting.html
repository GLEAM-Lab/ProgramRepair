  <style>
    :root{
      --bg:#efece5;
      --frame:#ffffff;
      --text:#1b2430;
      --muted:#6b7280;
      --border:rgba(27,36,48,.10);
      --border-strong:rgba(27,36,48,.22);
      --shadow-sm:0 1px 2px rgba(27,36,48,.06);
      --shadow-md:0 14px 36px rgba(27,36,48,.10);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;display:grid;place-items:center;
      background:var(--bg);color:var(--text);
      padding:32px 16px;
      font-family:system-ui,-apple-system,"Segoe UI","Inter","Helvetica Neue","DejaVu Sans",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
      text-rendering:optimizeLegibility;
    }
    main{width:min(96vw,1600px)}
    .toolbar{
      display:flex;justify-content:flex-end;flex-wrap:wrap;
      gap:10px;margin-bottom:14px;align-items:center;
    }
    .group{
      display:flex;gap:6px;padding:4px;
      background:rgba(255,255,255,.55);
      border:1px solid var(--border);border-radius:10px;
      backdrop-filter:blur(6px);
    }
    button{
      border:1px solid var(--border);background:#fff;color:var(--text);
      border-radius:7px;padding:7px 13px;
      font:600 13px/1 inherit;cursor:pointer;
      box-shadow:var(--shadow-sm);
      transition:transform 120ms ease,box-shadow 120ms ease,border-color 120ms ease,background 120ms ease;
    }
    button:hover{
      border-color:var(--border-strong);
      transform:translateY(-1px);
      box-shadow:0 4px 10px rgba(27,36,48,.10);
    }
    button:active{transform:translateY(0)}
    button.primary{background:#1b2430;color:#fff;border-color:#1b2430}
    button.primary:hover{background:#2d3a4a;border-color:#2d3a4a}
    button:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:var(--shadow-sm)}
    .frame{
      background:var(--frame);border-radius:14px;overflow:hidden;
      border:1px solid var(--border);box-shadow:var(--shadow-md);
    }
    svg{display:block;width:100%;height:auto}
    .toast{
      position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);
      background:#1b2430;color:#fff;padding:10px 16px;border-radius:999px;
      font:600 13px/1 inherit;box-shadow:0 8px 22px rgba(27,36,48,.22);
      opacity:0;pointer-events:none;transition:opacity 180ms ease,transform 180ms ease;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .toast.error{background:#a23a3a}
  </style>
</head>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById('taxonomy');

    function toast(msg, isError){
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.toggle('error', !!isError);
      t.classList.add('show');
      clearTimeout(toast._h);
      toast._h = setTimeout(() => t.classList.remove('show'), 2200);
    }

    function serializeSvg(){
      const c = svg.cloneNode(true);
      c.setAttribute('xmlns', SVG_NS);
      c.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
      return new XMLSerializer().serializeToString(c);
    }

    function downloadBlob(blob, name){
      const u = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = u; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(u);
    }

    function downloadSvg(){
      try{
        downloadBlob(new Blob([serializeSvg()], {type:'image/svg+xml;charset=utf-8'}), 'llm_repair_taxonomy.svg');
        toast('SVG downloaded');
      }catch(e){ toast('SVG export failed', true); console.error(e); }
    }

    function downloadPng(scale){
      try{
        const u = URL.createObjectURL(new Blob([serializeSvg()], {type:'image/svg+xml;charset=utf-8'}));
        const img = new Image();
        img.onload = () => {
          const bx = svg.viewBox.baseVal;
          const c  = document.createElement('canvas');
          c.width  = Math.round(bx.width  * scale);
          c.height = Math.round(bx.height * scale);
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(u);
          c.toBlob(b => {
            downloadBlob(b, `llm_repair_taxonomy_${scale}x.png`);
            toast(`PNG ${scale}× downloaded`);
          }, 'image/png');
        };
        img.onerror = () => { URL.revokeObjectURL(u); toast('PNG export failed', true); };
        img.src = u;
      }catch(e){ toast('PNG export failed', true); console.error(e); }
    }

    async function downloadPdf(){
      const btn = document.getElementById('btn-pdf');
      const orig = btn.textContent;
      try{
        if (!window.jspdf || !window.jspdf.jsPDF){
          toast('PDF library not loaded — check network', true);
          return;
        }
        const { jsPDF } = window.jspdf;
        const bx = svg.viewBox.baseVal;
        const w = bx.width, h = bx.height;

        const pdf = new jsPDF({
          orientation: w > h ? 'landscape' : 'portrait',
          unit: 'pt',
          format: [w, h],
          compress: true,
        });

        if (typeof pdf.svg !== 'function'){
          toast('svg2pdf.js not loaded — check network', true);
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Rendering…';

        await pdf.svg(svg, { x: 0, y: 0, width: w, height: h });
        pdf.save('llm_repair_taxonomy.pdf');
        toast('Vector PDF downloaded');
      }catch(e){
        console.error(e);
        toast('PDF export failed: ' + e.message, true);
      }finally{
        btn.disabled = false;
        btn.textContent = orig;
      }
    }
  </script>
